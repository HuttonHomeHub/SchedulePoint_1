<!doctype html>
<html lang="en-GB" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>SchedulePoint</title>
    <!--
      Applies the persisted theme before first paint. A served file rather than an inline script
      so `script-src` needs no `'unsafe-inline'` and no `sha256-` hash (ADR-0074) — see
      `public/theme-boot.js` for why the hash was rejected. Still parser-blocking, so the
      anti-flash guarantee is unchanged.
    -->
    <script src="/theme-boot.js"></script>
  </head>
  <body class="h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
