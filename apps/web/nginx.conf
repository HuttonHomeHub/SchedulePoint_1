# nginx config for serving the SchedulePoint SPA.
#
# **This file is an envsubst TEMPLATE**, copied to /etc/nginx/templates/default.conf.template
# (see apps/web/Dockerfile). The nginx image's own entrypoint renders it at container start, which
# is what lets an operator switch the CSP between report-only and enforce without a new image
# (ADR-0074 §4) — a rollback that needed a release would be slower than the incident it fixes.
#
# **`NGINX_ENVSUBST_FILTER=^CSP_` is essential and set in the Dockerfile.** Without it envsubst
# would substitute nginx's OWN variables — `$scheme`, `$host`, `$remote_addr`,
# `$proxy_add_x_forwarded_for`, `$uri` — with empty strings, producing a config that is subtly and
# comprehensively wrong: the API proxy would forward no Host and no client IP, and the SPA fallback
# would stop resolving. Only `CSP_`-prefixed names are replaced.

# Preserve the scheme the EDGE saw, rather than this container's own (TECH_DEBT #89).
#
# This block only ever listens on plain 8080 — TLS is terminated upstream — so `$scheme` is
# unconditionally `http` here. Sending it as `X-Forwarded-Proto` overwrote whatever the real proxy
# chain (Cloudflare → Nginx Proxy Manager → web) had already established, so the API believed every
# request was insecure. Now an arriving value wins and `$scheme` is only the fallback.
#
# **The operator half is still required**: the proxy in front must actually send the header. Without
# that this map falls back to `$scheme` and behaves exactly as before — see docs/DEPLOYMENT.md.
map $http_x_forwarded_proto $sp_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  # The document must always be revalidated. It names the fingerprinted entry chunk, and with route
  # splitting it names the lazy chunks' hashes too — a copy cached for a release would ask for
  # chunks the next release deleted, and a returning browser would sit on a chunk-load failure.
  # Reached for `/` and every SPA route too: `index` and the fallback's `try_files` both redirect
  # internally to `/index.html`, which this exact-match location then catches.
  #
  # **`expires -1`, not `add_header Cache-Control`, and that is the whole point.** Any `add_header`
  # in a location REPLACES every header inherited from `server` — the CSP, nosniff, framing and
  # permissions headers below would vanish from the one response that is a document. `expires -1`
  # emits `Cache-Control: no-cache` without being an `add_header`, so the inheritance survives.
  location = /index.html {
    expires -1;
  }

  # The theme-boot script is NOT fingerprinted — it lives in `public/` so its path can stay fixed
  # in index.html (ADR-0074) — so it must not be immutably cached, or a change to it would never
  # reach a returning browser. Short max-age: it is ~1 kB on an already-open connection.
  location = /theme-boot.js {
    expires 5m;
    add_header Cache-Control "public, max-age=300" always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  # The favicon lives in `public/` and is therefore NOT fingerprinted, so it must not be cached
  # immutably — a rebrand would never reach a returning browser. Its own `location` because the SPA
  # fallback below would otherwise hand `/favicon.svg` the index document, which is what
  # `/favicon.ico` used to get (ADR-0077 M5-T2).
  location = /favicon.svg {
    expires 1d;
    add_header Cache-Control "public, max-age=86400" always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  # Proxy API + auth requests to the API service so the SPA can call them
  # same-origin (cookies flow, no CORS). The upstream is the container/service
  # named `api` on the same network (see docker-compose*.yml); other deployments
  # front both behind an ingress or override this config.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sp_forwarded_proto;
  }

  # The organisation export (ADR-0194): a ZIP the API generates and streams while it reads, for as
  # long as the organisation is big. It needs its own location because `/api/` above has nginx's
  # defaults, which are wrong for it in two ways:
  #
  #  - `proxy_buffering on` would spool the response to the proxy's disk before the browser sees a
  #    byte. The export's promise is that nothing is stored on the server, and the page's progress
  #    line and Cancel button would be watching a buffer fill rather than the transfer.
  #  - `proxy_read_timeout` defaults to 60 s, and an export that is slow to produce its next chunk
  #    (a large table, a slow reader) would be cut mid-archive, which the browser reports as a
  #    failed download.
  #
  # 660 s is the API's 10-minute export transaction ceiling (`EXPORT_TRANSACTION_TIMEOUT_MS`) plus a
  # minute of margin, so nginx never cuts an export the API is still entitled to finish. The route
  # takes no request body, so `proxy_request_buffering off` costs nothing and keeps the request
  # from being held either.
  #
  # A regex location (the slug varies) wins over the `/api/` prefix above. It sets no `add_header`,
  # exactly as `/api/` does, so it inherits the server-level security headers and does not need the
  # snippet (the check:nginx rule is about locations that DO set one).
  location ~ ^/api/v1/organizations/[^/]+/export$ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sp_forwarded_proto;
  }

  # SPA fallback: route everything else to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- Security headers -----------------------------------------------------
  #
  # One set, in a shared snippet, because a location with its own `add_header` loses these (see the
  # snippet, TECH_DEBT #457). `always` on every one, so error responses carry them too.
  include /etc/nginx/conf.d/snippets/security-headers.conf;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
}
