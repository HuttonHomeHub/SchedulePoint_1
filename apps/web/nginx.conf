# nginx config for serving the SchedulePoint SPA.
#
# **This file is an envsubst TEMPLATE**, copied to /etc/nginx/templates/default.conf.template
# (see apps/web/Dockerfile). The nginx image's own entrypoint renders it at container start, which
# is what lets an operator switch the CSP between report-only and enforce without a new image
# (ADR-0074 §4) — a rollback that needed a release would be slower than the incident it fixes.
#
# **`NGINX_ENVSUBST_FILTER=^CSP_` is essential and set in the Dockerfile.** Without it envsubst
# would substitute nginx's OWN variables — `$scheme`, `$host`, `$remote_addr`,
# `$proxy_add_x_forwarded_for`, `$uri` — with empty strings, producing a config that is subtly and
# comprehensively wrong: the API proxy would forward no Host and no client IP, and the SPA fallback
# would stop resolving. Only `CSP_`-prefixed names are replaced.

# Preserve the scheme the EDGE saw, rather than this container's own (TECH_DEBT #89).
#
# This block only ever listens on plain 8080 — TLS is terminated upstream — so `$scheme` is
# unconditionally `http` here. Sending it as `X-Forwarded-Proto` overwrote whatever the real proxy
# chain (Cloudflare → Nginx Proxy Manager → web) had already established, so the API believed every
# request was insecure. Now an arriving value wins and `$scheme` is only the fallback.
#
# **The operator half is still required**: the proxy in front must actually send the header. Without
# that this map falls back to `$scheme` and behaves exactly as before — see docs/DEPLOYMENT.md.
map $http_x_forwarded_proto $sp_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache fingerprinted assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The theme-boot script is NOT fingerprinted — it lives in `public/` so its path can stay fixed
  # in index.html (ADR-0074) — so it must not be immutably cached, or a change to it would never
  # reach a returning browser. Short max-age: it is ~1 kB on an already-open connection.
  location = /theme-boot.js {
    expires 5m;
    add_header Cache-Control "public, max-age=300" always;
  }

  # Proxy API + auth requests to the API service so the SPA can call them
  # same-origin (cookies flow, no CORS). The upstream is the container/service
  # named `api` on the same network (see docker-compose*.yml); other deployments
  # front both behind an ingress or override this config.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sp_forwarded_proto;
  }

  # SPA fallback: route everything else to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- Security headers -----------------------------------------------------
  #
  # `always` on every one of these, so they are present on error responses too — a 404 rendered by
  # the SPA fallback is a document like any other.

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content-Security-Policy (TECH_DEBT #8, ADR-0074 §4). The name and the value are BOTH operator
  # variables: `CSP_HEADER_NAME` defaults to the report-only header so a deployment observes before
  # it enforces, and flipping either direction is an env change rather than a release.
  #
  # The policy is derived from what this app actually loads, not from a template. There are no
  # external origins at all — no CDN, no external fonts, no workers, and no `eval` in the pinned
  # jsPDF — so everything is `'self'` except `blob:` on `img-src`, which is load-bearing because
  # the print surface renders a live `<img src={URL.createObjectURL(blob)}>`.
  #
  # `style-src 'self'` is deliberately strict and is an INFERENCE from source, not a
  # browser-verified fact: React's `style={{…}}` sets individual CSSOM properties rather than
  # parsing a style attribute, and browsers generally do not gate that on `'unsafe-inline'`.
  # Falsifying that is the whole point of the report-only window. If it turns out to be needed, the
  # fallback is `'unsafe-inline'` on **`style-src` only** — never on `script-src`.
  #
  # No `report-to`/`report-uri`: violations reach the browser console, which for a single-operator
  # deployment is a real verification tool. A `POST /api/v1/csp-reports` sink would be a new
  # `@Public()` route and ADR-0051 established that list stays short.
  add_header ${CSP_HEADER_NAME} "${CSP_POLICY}" always;

  # Cross-origin isolation siblings. Cheap, and nothing in this app has a consumer for either.
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;

  # Permissions-Policy is ENUMERATED, never blanket-denied. `clipboard-write` is a
  # Permissions-Policy-controlled feature in Chromium and the app uses `navigator.clipboard` in
  # ShareLinksDialog and InviteMemberDialog — both Copy buttons that are the entire point of their
  # dialogs. A `*=()` deny-all would break a shipped feature silently (ADR-0074 §4).
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

  # HSTS is deliberately absent. This block listens only on plain 8080, so the container cannot
  # know whether the browser used HTTPS, and TECH_DEBT #89 records that the header which would tell
  # it arrives as `http` through the real chain. HSTS is also sticky — `max-age` pins the browser,
  # so a mistake is expensive to reverse. It belongs at the edge terminator, where the TLS is.

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml;
}
