<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SchedulePoint">
  <!--
    The owner's brand mark, taken from the SchedulePoint_Website repository (adopted 2026-11-16):
    the tile form, a navy square carrying two white activity bars, a light-blue logic link and a
    copper milestone target.
    Colour literals are correct here and only here — an SVG served as a file has no access to the
    app's CSS custom properties, and a favicon has no theme to follow.

    Served as a file rather than a `data:` URI because ADR-0074's Content-Security-Policy is
    `img-src 'self' blob:` with no `data:` — the zero-request trick is blocked on this origin.
  -->
  <rect width="64" height="64" rx="14" fill="#1C2433" />
  <path d="M42 20 h2 a7 7 0 0 1 7 7 v10" fill="none" stroke="#6E9BE0" stroke-width="5.5" stroke-linecap="round" />
  <rect x="8" y="14" width="34" height="11" rx="5.5" fill="#FFFFFF" />
  <rect x="8" y="42" width="30" height="11" rx="5.5" fill="#FFFFFF" />
  <circle cx="51" cy="47.5" r="9.5" fill="#C9822E" />
  <circle cx="51" cy="47.5" r="4.75" fill="#1C2433" />
  <circle cx="51" cy="47.5" r="2.4" fill="#C9822E" />
</svg>
