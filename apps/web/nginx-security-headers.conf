# The security header set, shared by every `server`/`location` that sends its own `add_header`.
#
# **This file is an envsubst TEMPLATE too**, copied to /etc/nginx/templates/snippets/ (see
# apps/web/Dockerfile) and rendered to /etc/nginx/conf.d/snippets/security-headers.conf. The
# subdirectory is deliberate: the stock nginx.conf includes `conf.d/*.conf` at `http` level, and a
# snippet of bare `add_header`s must not be loaded there as well as where it is meant to be.
#
# **Why a shared file at all (TECH_DEBT #457).** An `add_header` in a location REPLACES every header
# inherited from `server`, so `/assets/`, `/theme-boot.js` and `/favicon.svg` — which each set a
# `Cache-Control` of their own — answered with that header and none of the set below, while
# `/index.html` (which uses `expires`, not `add_header`) carried all of it. Each of those locations
# now includes this file as well, and `pnpm check:nginx` fails a location that has an `add_header`
# without the include. The set is the full one everywhere, CSP and framing headers on a script
# included: harmless there, and one set that never varies by path is one nobody can get wrong.

# --- Security headers -----------------------------------------------------
#
# `always` on every one of these, so they are present on error responses too — a 404 rendered by
# the SPA fallback is a document like any other.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy (TECH_DEBT #8, ADR-0074 §4). The name and the value are BOTH operator
# variables: `CSP_HEADER_NAME` defaults to the report-only header so a deployment observes before
# it enforces, and flipping either direction is an env change rather than a release.
#
# The policy is derived from what this app actually loads, not from a template. There are no
# external origins at all — no CDN, no external fonts, no workers, and no `eval` in the pinned
# jsPDF — so everything is `'self'` except `blob:` on `img-src`, which is load-bearing because
# the print surface renders a live `<img src={URL.createObjectURL(blob)}>`.
#
# `style-src 'self'` is deliberately strict and is an INFERENCE from source, not a
# browser-verified fact: React's `style={{…}}` sets individual CSSOM properties rather than
# parsing a style attribute, and browsers generally do not gate that on `'unsafe-inline'`.
# Falsifying that is the whole point of the report-only window. If it turns out to be needed, the
# fallback is `'unsafe-inline'` on **`style-src` only** — never on `script-src`.
#
# **The policy now reports.** This comment said "No `report-to`/`report-uri`: violations reach the
# browser console, which for a single-operator deployment is a real verification tool" — and that
# was true until somebody had to act on it. The console only holds what happened in a tab that was
# open, so the evidence for the enforce decision was produced by real browsers and then discarded,
# and the documented procedure was to flip the header and walk six surfaces watching DevTools.
# ADR-0074's own report-only window found a real violation that way (Zod's `allowsEval` probe) —
# in production, after release, because a person happened to be looking.
#
# So the sink exists (staff-console M4, ADR-0086): a `@Public()`, throttled, always-204
# `POST /api/v1/csp-report`. ADR-0051's "that list stays short" still holds — it is the second
# entry on it, and browsers cannot authenticate a violation report, so unauthenticated is not a
# choice.
#
# **Both directives, because support differs by engine and neither is universal.** `report-uri` is
# deprecated and still the only thing several engines implement; `report-to` is current and needs
# the `Reporting-Endpoints` header below to name the group. Emitting both is the practical answer
# rather than a hedge — a browser that understands `report-to` ignores `report-uri`.
#
# Both are inside `CSP_POLICY`'s default, not appended here, so an operator overriding the policy
# gets the reporting with it and cannot silently lose the sink by setting one variable.
add_header ${CSP_HEADER_NAME} "${CSP_POLICY}" always;

# Names the group `report-to` refers to. A separate header by specification, not a CSP directive.
#
# The variable is `CSP_REPORTING_ENDPOINTS` — the `CSP_` prefix is **load-bearing**, not cosmetic:
# `NGINX_ENVSUBST_FILTER="^CSP_"` (apps/web/Dockerfile) restricts substitution to that prefix, and
# widening the filter would let envsubst eat nginx's own scheme and host variables, which ADR-0074
# records as essential. A variable named without that prefix is never substituted at all, so the
# placeholder reaches nginx literally and fails the config parse at boot.
#
# **SINGLE quotes, and they are not a style choice — double quotes here do not start nginx.** The
# header's own grammar puts the URL in double quotes (`csp="/api/v1/csp-report"`), so the
# substituted value CONTAINS them; wrapped in double quotes the string terminates at the value's
# first `"` and nginx reads the URL as a bare token — `[emerg] unexpected "/"`, and the container
# never serves a request. Caught by CI's smoke-boot and by nothing else: the `e2e-csp` suite reads
# this policy from `docker-compose.yml` and serves it from a preview server, so it exercises the
# POLICY and never nginx's parse of this file. That is the gap `nginx -t` in `check:nginx` closes.
add_header Reporting-Endpoints '${CSP_REPORTING_ENDPOINTS}' always;

# Cross-origin isolation siblings. Cheap, and nothing in this app has a consumer for either.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Permissions-Policy is ENUMERATED, never blanket-denied. `clipboard-write` is a
# Permissions-Policy-controlled feature in Chromium and the app uses `navigator.clipboard` in
# ShareLinksDialog and InviteMemberDialog — both Copy buttons that are the entire point of their
# dialogs. A `*=()` deny-all would break a shipped feature silently (ADR-0074 §4).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# HSTS is deliberately absent. This block listens only on plain 8080, so the container cannot
# know whether the browser used HTTPS, and TECH_DEBT #89 records that the header which would tell
# it arrives as `http` through the real chain. HSTS is also sticky — `max-age` pins the browser,
# so a mistake is expensive to reverse. It belongs at the edge terminator, where the TLS is.
