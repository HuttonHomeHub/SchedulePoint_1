# Local development stack for SchedulePoint.
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# This compose file is intended for LOCAL DEVELOPMENT ONLY. Production
# deployment is described in docs/DEPLOYMENT.md and uses images published to
# the GitHub Container Registry (ghcr.io).

name: schedulepoint

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    # Bound the logs (`docs/TECH_DEBT.md` #100). Docker's default json-file driver has **no
    # rotation**, so a container that logs steadily fills the host disk until something else fails
    # first — and the API's structured Pino output is exactly that. 10 MB × 3 is enough history to
    # investigate an incident from the previous day without keeping a month nobody reads.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Bound the logs (`docs/TECH_DEBT.md` #100). Docker's default json-file driver has **no
    # rotation**, so a container that logs steadily fills the host disk until something else fails
    # first — and the API's structured Pino output is exactly that. 10 MB × 3 is enough history to
    # investigate an incident from the previous day without keeping a month nobody reads.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}?schema=public
      API_PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Off by default: the verification email is sent, but requiring it is a
      # deployment decision that needs a mail transport (see MAIL_SMTP_URL).
      AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-false}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      # Unset = the logging stub. A variable reaches the container only by being
      # listed here; putting it in .env alone interpolates but does not pass through.
      MAIL_SMTP_URL: ${MAIL_SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Operational alerting (staff console M1). Unset = today's behaviour exactly: a mail
      # failure is logged and nothing else. Set MAIL_ALERT_URL to any endpoint accepting a
      # JSON POST and a broken relay produces a message instead of a silence. The body names
      # counts, the window and the message kinds — never a recipient, because it leaves for a
      # third party. See docs/DEPLOYMENT.md "Alerting on mail failures".
      MAIL_ALERT_URL: ${MAIL_ALERT_URL:-}
      MAIL_ALERT_WINDOW_MINUTES: ${MAIL_ALERT_WINDOW_MINUTES:-10}
      # Dead-man's-switch: the API pings out on an interval so an external check can alert on
      # the ABSENCE of pings — the only signal that survives the API being what is broken.
      # Unset = no timer at all. Treat the URL as a credential; it is never logged.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}
      HEARTBEAT_INTERVAL_MINUTES: ${HEARTBEAT_INTERVAL_MINUTES:-5}
      # Retention (ADR-0087). Deletes rows past their documented period on a timer inside the API.
      # ON by default — a sweep needs no external receiver, unlike the two alerting URLs above, and
      # both periods were already decided by an accepted ADR. Set RETENTION_SWEEP_ENABLED=false and
      # recreate to roll back; disabled creates no timer at all.
      #
      # Shortening a period is free; LENGTHENING IT RECOVERS NOTHING (ADR-0085 D3's asymmetry).
      RETENTION_SWEEP_ENABLED: ${RETENTION_SWEEP_ENABLED:-true}
      RETENTION_CSP_REPORTS_DAYS: ${RETENTION_CSP_REPORTS_DAYS:-30}
      RETENTION_MAIL_EVENTS_DAYS: ${RETENTION_MAIL_EVENTS_DAYS:-365}
      RETENTION_SWEEP_INTERVAL_MINUTES: ${RETENTION_SWEEP_INTERVAL_MINUTES:-60}
      # SchedulePoint staff console (ADR-0086). Comma-separated addresses that may reach
      # /api/v1/staff/*. Empty = nobody, which is the default and the safe direction.
      # Changing it needs host access and a container recreate — deliberately the same bar
      # as reading the database, so it creates no new privilege path. An allowlisted address
      # must ALSO have a verified email, unconditionally, or it would be squattable.
      STAFF_EMAILS: ${STAFF_EMAILS:-}
      PLAN_EDIT_LOCK_ENFORCED: ${PLAN_EDIT_LOCK_ENFORCED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Declared in the env schema and .env.example, so they must be listed here too —
      # a variable reaches the container only by appearing in this block. Missing until
      # the 2026-08-04 reconciliation pass, which is the defect PR #225 fixed for the
      # mail variables and did not sweep for.
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
    ports:
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    # Bound the logs (`docs/TECH_DEBT.md` #100). Docker's default json-file driver has **no
    # rotation**, so a container that logs steadily fills the host disk until something else fails
    # first — and the API's structured Pino output is exactly that. 10 MB × 3 is enough history to
    # investigate an incident from the previous day without keeping a month nobody reads.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      - api
    # Content-Security-Policy mode (ADR-0074 §4). Report-only by default so a deployment observes
    # before it enforces; both the header NAME and the policy are operator variables, so flipping to
    # enforce — or rolling back — is an env change rather than a new image through the release train.
    #
    #   CSP_HEADER_NAME=Content-Security-Policy    # enforce
    #   CSP_HEADER_NAME=Content-Security-Policy-Report-Only   # observe (default)
    environment:
      CSP_HEADER_NAME: ${CSP_HEADER_NAME:-Content-Security-Policy-Report-Only}
      CSP_POLICY: ${CSP_POLICY:-default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests; report-uri /api/v1/csp-report; report-to csp}
      # Names the group `report-to` refers to (staff-console M4). Same-origin, so the web
      # container's own nginx proxies it to the API — no CORS, no preflight, and the reports
      # never leave the deployment. The CSP_ prefix is required: NGINX_ENVSUBST_FILTER is ^CSP_.
      CSP_REPORTING_ENDPOINTS: ${CSP_REPORTING_ENDPOINTS:-csp="/api/v1/csp-report"}
    ports:
      - '8080:8080'

volumes:
  db-data:
