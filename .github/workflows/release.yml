name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version & tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commits and the vX.Y.Z tag
      pull-requests: write # open/update the "Version Packages" PR
    outputs:
      api_version: ${{ steps.meta.outputs.api_version }}
      web_version: ${{ steps.meta.outputs.web_version }}
      publish_api: ${{ steps.meta.outputs.publish_api }}
      publish_web: ${{ steps.meta.outputs.publish_web }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # When there are pending changesets this opens/updates the "Version
      # Packages" PR (bumping versions + writing CHANGELOG.md). When that PR is
      # merged, no changesets remain (`has-changesets` == 'false') and the bumped
      # versions are already on this commit — that is a release.
      #
      # We do NOT use a `publish` command here: `changeset publish` is npm-only
      # and no-ops on our private packages (so it never creates a tag). Tagging
      # and image publishing are handled explicitly below.
      #
      # **v2 renames FIVE things, not one** (read from the action's own `action.yml`
      # at the v2 tag, not from release notes or from the comment this replaces):
      # `version` → `version-script`, `commit` → `commit-message`, `title` →
      # `pr-title`, the `GITHUB_TOKEN` env var → a `github-token` INPUT, and the
      # `hasChangesets` output → `has-changesets`. GitHub Actions **silently ignores
      # unrecognised `with:` keys**, so migrating only the output — which is what the
      # note here used to describe — would have left this step running a bare
      # `changeset version` instead of `pnpm version-packages`, titling the PR
      # "Version Packages", and reading an empty output. Two of those are invisible
      # and the third stops the release.
      - name: Create release pull request
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'

      # A release lands when the "Version Packages" PR was just merged: no
      # changesets remain AND a package's version has no git tag yet. Each app is
      # tagged INDEPENDENTLY — `api-vX.Y.Z` / `web-vX.Y.Z` — because their versions
      # bump on their own cadence (Changesets bumps only the packages a changeset
      # names). A single aggregate `v{max}` tag could NOT represent a web-only bump
      # once web caught up to api's version: `max(0.7.0, 0.7.0)` is `v0.7.0`, which
      # api had already tagged, so the web release was silently skipped (ADR-0027).
      # Per-package tags are monotonic per package, so that collision can't recur.
      #
      # `has-changesets` is the **v2** output name. Under v1 it was `hasChangesets`
      # (camelCase), and reading the wrong name yields an EMPTY string — on which
      # `[ "" = "false" ]` is false, so nothing is tagged, nothing is published, and
      # the workflow goes GREEN. The only symptom is that no new image ever reaches
      # GHCR while the host keeps serving the old one, and the "Version Packages" PR
      # carries no checks by design (§11), so nothing else would catch it either.
      #
      # The assertion below predates the upgrade. It was written when this was still
      # a v1 workflow, precisely so that the eventual bump would fail LOUDLY instead
      # of going quiet — a comment is not a gate (ADR-0058). It is kept, and its job
      # is now the mirror image: if a future version renames the output again, or if
      # someone reverts to v1 without reverting this expression, the release stops
      # with a message instead of succeeding at nothing.
      #
      # Note it guards only the OUTPUT. The three renamed **inputs** have no such
      # protection and cannot easily get one — Actions ignores unknown `with:` keys
      # without warning, so a wrong input name is indistinguishable from an omitted
      # one. That asymmetry is why the migration was done by reading `action.yml`
      # rather than by trusting the note that used to sit here (TECH_DEBT #180).
      - name: Determine release
        id: meta
        run: |
          HAS_CHANGESETS='${{ steps.changesets.outputs.has-changesets }}'
          if [ "$HAS_CHANGESETS" != "true" ] && [ "$HAS_CHANGESETS" != "false" ]; then
            echo "::error::changesets/action gave has-changesets='$HAS_CHANGESETS' (expected 'true' or 'false')." >&2
            echo "::error::The output name has moved. v1 called it 'hasChangesets', v2 calls it 'has-changesets'; check this step against the action's own action.yml at the pinned tag. Reading the wrong name yields an empty string, on which the release gate silently stops tagging and publishing." >&2
            exit 1
          fi
          API_VERSION="$(node -p "require('./apps/api/package.json').version")"
          WEB_VERSION="$(node -p "require('./apps/web/package.json').version")"
          echo "api_version=$API_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"
          PUBLISH_API=false
          PUBLISH_WEB=false
          if [ "$HAS_CHANGESETS" = "false" ]; then
            git rev-parse "refs/tags/api-v$API_VERSION" >/dev/null 2>&1 || PUBLISH_API=true
            git rev-parse "refs/tags/web-v$WEB_VERSION" >/dev/null 2>&1 || PUBLISH_WEB=true
          fi
          echo "publish_api=$PUBLISH_API" >> "$GITHUB_OUTPUT"
          echo "publish_web=$PUBLISH_WEB" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH_API" = "true" ] || [ "$PUBLISH_WEB" = "true" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing: api=$PUBLISH_API (v$API_VERSION), web=$PUBLISH_WEB (v$WEB_VERSION)."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "No release to tag (pending changesets, or both app versions already tagged)."
          fi

      - name: Configure git author
        if: steps.meta.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      # Tag + publish a GitHub Release for each app that just released, in
      # independent steps so a transient failure tagging one app doesn't block the
      # other's ready release. Only an app whose version has no tag yet is tagged
      # (the gate above), so re-runs are idempotent.
      - name: Tag api release
        if: steps.meta.outputs.publish_api == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="api-v${{ steps.meta.outputs.api_version }}"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes

      - name: Tag web release
        if: steps.meta.outputs.publish_web == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="web-v${{ steps.meta.outputs.web_version }}"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          gh release create "$tag" --title "$tag" --generate-notes

  # Build + push the container images for the release. Invoked directly (rather
  # than via the tag push above, which the default GITHUB_TOKEN cannot use to
  # trigger another workflow) so publishing is fully automatic. Each app's image
  # is tagged with ITS OWN package version, and only the app(s) that released are
  # (re)built — so an unreleased app's version tag never moves to drifted content.
  publish:
    name: Publish images
    needs: release
    if: needs.release.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      api_version: ${{ needs.release.outputs.api_version }}
      web_version: ${{ needs.release.outputs.web_version }}
      publish_api: ${{ needs.release.outputs.publish_api == 'true' }}
      publish_web: ${{ needs.release.outputs.publish_web == 'true' }}
