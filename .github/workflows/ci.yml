name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Format, lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/api prisma:generate

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # A dead link in an ADR is worse than a typo: the decision record is what
      # you reach for when nobody remembers why, and it has to still resolve.
      # The 2026-07-27 reconcile found five by hand, two of which that same pass
      # had created by deleting a directory an ADR pointed at.
      - name: Check documentation links
        run: pnpm check:doc-links

      # The playbook says which plan proves what. Its rows name plans by id, and a row pointing at
      # a plan that no longer exists sends a reader to seed nothing and conclude the feature is
      # broken. The reverse — a plan nobody documented — is worse: it gets seeded, looks plausible
      # and demonstrates nothing, which is the state the whole catalogue exists to end (ADR-0066
      # M5.3). Needs no database and no credentials; the inventory is built in memory.
      - name: Check the test playbook
        run: pnpm check:playbook

      # The ADR-0019 build contract, checked rather than remembered. Adding a shared package means
      # adding three lines by hand (two Dockerfile stages + the e2e job's direct build step), and
      # missing one is invisible locally because the developer's checkout still has the package's
      # `dist/` from an earlier build. `@repo/layout` (ADR-0069) shipped that way and only failed
      # in the image build, minutes in, with an error naming a module that exists.
      - name: Check the build contract
        run: pnpm check:build-contract

      # The surface contract (docs/specs/engine-surface-audit.md). Four of that audit's findings are
      # one defect: a scheduling field grew a storage half and an API half, never grew a UI half, and
      # nothing noticed for a year. Each looked right in the layer its author was in; none is visible
      # without holding two layers side by side, which is what this does and a reviewer does not.
      # It fails on an UNCLASSIFIED field, not on one honestly marked a known gap.
      - name: Check the surface contract
        run: pnpm check:surface-contract

      # CLAUDE.md's stage banner states six counts. Every one of them was wrong at the last
      # reconciliation pass, and the correction told the reader to re-run `ls | wc -l` if the
      # recount date was not today's — advice that is correct and useless, because a reader who
      # trusts the number never checks the date. It was wrong again one day later. A count is the
      # most computable claim in the repository (ADR-0076).
      - name: Check the stage-banner counts
        run: pnpm check:counts

      # Every VITE_ flag is default-ON — they are rollback contracts, not configuration — and each
      # one's flag-off branch is a second product maintained forever. Pins that every flag records
      # when it flipped and which dated batch retires it, and fails when a batch date passes with
      # the batch not done (ADR-0084). Fourteen flags reached this gate with no enablement date
      # recorded anywhere at all.
      - name: Check the feature-flag retirement schedule
        run: pnpm check:flags

      # Claims about a DEPENDENCY's internals — file-and-line citations into `better-auth`,
      # `better-call`, `nodemailer`, `zod` and others, several of which whole ADRs rest on. (This
      # comment said "34" until 2026-08-13, when the register held 49: a hard number in a comment
      # nothing gates is the same defect the gate below exists for, one layer out.) A minor bump moves every one of them
      # and nothing here was watching, so the prose would keep reading as authoritative while the
      # decisions it justifies rested on nothing. Pins the verified version, the anchor at each
      # cited line, and that no citation exists outside the register (ADR-0076).
      - name: Check dependency-internal claims
        run: pnpm check:claims

      # Every ADR is reachable from the document a reader navigates product direction by.
      # Written because THREE consecutive reconciliation passes found `docs/ROADMAP.md` silent on
      # the newest ADRs — 0067–0073, then 0074–0085, then 0087–0092 — each time found by hand, and
      # the second of those recorded that it was "a numbered step and not a habit". It was a
      # numbered step, and it happened again. `docs/RECONCILE.md` §1 says to write a gate instead
      # of a reminder; this is that gate. Deliberately aimed at ROADMAP rather than CLAUDE.md's
      # register, which was complete on all three occasions: only the roadmap rots silently,
      # because nothing downstream breaks when a shipped capability is missing from it.
      - name: Check ADR coverage
        run: pnpm check:adr-coverage

      # The web container's nginx template, substituted exactly as the container substitutes it.
      # A value that breaks the config parse is a container that never serves a request, and until
      # this existed the ONLY thing in the repository that would notice was the smoke-boot job — a
      # container build away, reporting minutes later, after the push. `e2e-csp` cannot see it: it
      # reads the policy from `docker-compose.yml` and serves it from a preview server, so it tests
      # the policy and never nginx's parse of the file. Verified red against the failure that
      # prompted it (`[emerg] unexpected "/"`, PR #269).
      - name: Check the nginx template survives substitution
        run: pnpm check:nginx

      - name: Unit tests
        run: pnpm test

      - name: Build (api + web)
        run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # A disposable PostgreSQL for API end-to-end tests (Supertest).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app_test?schema=public
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Playwright API web server runs the compiled app (`nest start` →
      # `node dist/main.js`), which resolves `@repo/types` to its built output
      # (`exports.default` → `dist/`). Unlike the Turbo-driven `quality` job,
      # this job runs those steps directly, so it must build the shared packages
      # first — otherwise the web e2e web server crashes with MODULE_NOT_FOUND.
      #
      # EVERY package `apps/api` or `apps/web` imports must be listed. A local
      # checkout hides an omission, because a `dist/` built by an earlier run is
      # still lying there; CI starts clean and fails at `nest build` instead
      # (`@repo/layout` was missed exactly this way — ADR-0019 build contract).
      - name: Build shared packages
        run: pnpm --filter @repo/types build && pnpm --filter @repo/interchange build && pnpm --filter @repo/layout build

      - name: Generate Prisma client
        run: pnpm --filter @repo/api prisma:generate

      - name: Apply database migrations
        run: pnpm --filter @repo/api prisma:deploy

      # Schema ↔ migration lock-step. The migrations have just been applied to
      # a pristine database, so diffing that database against the datamodel
      # answers one question: does `schema.prisma` describe what the migrations
      # actually build? A non-empty diff means someone edited the model without
      # writing the matching migration (or wrote one that drifted) — caught here
      # rather than at `prisma migrate dev` on the next contributor's machine.
      # Objects Prisma cannot express (partial indexes/uniques, CHECK and
      # EXCLUDE constraints — this repo has many, by convention in raw SQL) are
      # invisible to both sides of the diff, so they neither pass nor trip it;
      # they stay documented in the model comments instead (TECH_DEBT #54).
      - name: Check schema/migration drift
        run: pnpm --filter @repo/api prisma:check-drift

      # API e2e (Supertest) and web e2e (Playwright) run sequentially — they
      # share the test database, so running them in parallel could race.
      - name: API end-to-end tests
        run: pnpm --filter @repo/api test:e2e

      # The ADR-0066 pairwise differential: seed 63 generated plans over real HTTP,
      # recalculate each, and compare the application against `computeSchedule` run on
      # the SAME spec. Its own step so the wall-clock is attributed rather than hidden,
      # and it runs the WHOLE covering array — a truncated one is not a covering array,
      # and "the pairwise differential passes" would quietly stop meaning what it says.
      # Measured at ~145 s locally over 63 plans; if it ever becomes the long pole,
      # shard it rather than shortening it.
      - name: Pairwise differential (seed catalogue)
        run: pnpm --filter @repo/api test:e2e:pairwise

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps

      # Playwright starts the API and web dev servers itself (see
      # apps/web/playwright.config.ts) and drives the full stack in a browser.
      # This run serves the app FLAG-OFF (read-only surface, pen inert).
      - name: Web end-to-end tests
        run: pnpm --filter @repo/web test:e2e

      # Flag-ON editing journeys: a second Playwright run (playwright.edit.config.ts)
      # serving the app with VITE_TSLD_EDITING + VITE_PLAN_EDIT_LOCK on and the API
      # enforcing the lock (PLAN_EDIT_LOCK_ENFORCED=true), so on-canvas editing and the
      # pen are really exercised (TECH_DEBT #25b/#27b). It runs after the flag-off run
      # tears down its servers, reusing the same ports.
      - name: Web end-to-end tests (editing flags on)
        run: pnpm --filter @repo/web test:e2e:edit

      # The canvas-maximal toolbar journey (playwright.toolbar.config.ts): the toolbar-hosted
      # workspace — slim header + one command toolbar over a chromeless canvas, activities panel
      # collapsed by default — exercised end to end with the editing flags on and the pen enforced
      # (ADR-0031). It is NOT a flag-on journey any more, and this comment said it was until
      # ADR-0088 D3: `VITE_CANVAS_TOOLBAR` and `VITE_CANVAS_WORKSPACE` are both retired, so there is
      # no layering left to describe — this is the only plan workspace there is. Runs after the
      # prior runs tear down their servers, reusing the ports.
      - name: Web end-to-end tests (canvas toolbar workspace)
        run: pnpm --filter @repo/web test:e2e:toolbar

      # The toolbar FIT gate (playwright.toolbar-fit.config.ts, ADR-0090 M1). One invariant: a
      # command a planner can see is a command a planner can click, at eight widths on both rows.
      #
      # It is a separate config because it must pin NO VITE_ flags at all — a published image
      # carries every flag at its default (ADR-0088 D1), so the shipped surface IS the default
      # surface, and the step above deliberately pins VITE_CANVAS_AUTHORING off, which changes
      # Row 2's composition at exactly the width where `print` used to clip.
      #
      # This cannot be a unit test and never could: jsdom has no layout, so ~25 suites rendering
      # <Toolbar> stayed green while two controls sat outside the row, pointer-unreachable, on a
      # 1920x1080 monitor.
      - name: Web end-to-end tests (toolbar fit)
        run: pnpm --filter @repo/web test:e2e:toolbar-fit

      # Flag-ON canvas-first authoring journey (playwright.authoring.config.ts) serving the app with
      # VITE_CANVAS_AUTHORING on (layered on the editing/pen flags), so building a
      # plan directly on the canvas — blank-canvas first draw, inline start date, auto-recalc,
      # on-canvas milestones, two-click linking — is exercised end to end (ADR-0032). Runs last,
      # after the prior runs tear down their servers, reusing the ports.
      - name: Web end-to-end tests (canvas authoring flag on)
        run: pnpm --filter @repo/web test:e2e:authoring

      # Flag-ON live cross-plan / programme scheduling journey (playwright.programme.config.ts) serving
      # the app with VITE_PROGRAMME_SCHEDULING on (plus VITE_INTER_PROJECT_DATES, on the legacy stacked
      # plan-detail page with the pen off), so drawing a live cross-plan link and running a programme
      # recalculate — the result panel, the driven "External" badge, and the staleness cycle — is
      # exercised end to end (ADR-0045 F8). Runs last, after the prior runs tear down their servers.
      - name: Web end-to-end tests (programme scheduling flag on)
        run: pnpm --filter @repo/web test:e2e:programme

      # Flag-ON Notes journey (playwright.notes.config.ts) serving the app with VITE_NOTES on (on the
      # legacy stacked plan-detail page with the pen off — notes are not pen-gated), so adding, editing
      # and deleting an activity note, the per-row count badge tracking it, and an axe pass are
      # exercised end to end (ADR-0046). Runs last, after the prior runs tear down their servers.
      - name: Web end-to-end tests (notes flag on)
        run: pnpm --filter @repo/web test:e2e:notes

      # Flag-ON undo/redo journey (playwright.undo.config.ts) serving the app with VITE_UNDO_REDO on
      # (layered on the canvas authoring + editing/pen flags, with the pen enforced), so
      # the user-visible undo surface — the toolbar Undo/Redo controls, the Ctrl/Cmd+Z keybinding, the
      # announcements — is exercised end to end (ADR-0048 M3). Runs last, after the prior runs tear down
      # their servers, reusing the ports.
      - name: Web end-to-end tests (undo/redo flag on)
        run: pnpm --filter @repo/web test:e2e:undo

      # Flag-ON on-canvas activity types journey (playwright.loe.config.ts) serving the app with
      # VITE_CANVAS_ACTIVITY_TYPES on (layered on the canvas authoring + editing/pen
      # flags, with the pen enforced), so the Level-of-Effort endpoint-pick tool — the Add-menu item,
      # the two-click keyboard pick, and the announcements — is exercised end to end (Stage D). Runs
      # last, after the prior runs tear down their servers, reusing the ports.
      - name: Web end-to-end tests (on-canvas activity types flag on)
        run: pnpm --filter @repo/web test:e2e:loe

      # Flag-ON canvas resource view journey (playwright.resource-view.config.ts) serving the app with
      # VITE_CANVAS_RESOURCE_VIEW on (plus VITE_RESOURCES + VITE_RESOURCE_CURVES for the data source,
      # layered on the canvas authoring + editing/pen flags), so the axis-aligned demand
      # strip — reveal, resource/bucket pickers, the accessible data table, and the on-bar
      # over-allocation highlight — is exercised end to end (Stage E). Runs last, after the prior runs
      # tear down their servers, reusing the ports.
      - name: Web end-to-end tests (canvas resource view flag on)
        run: pnpm --filter @repo/web test:e2e:resource-view

      # Flag-ON schedule interchange (XER import) journey (playwright.interchange.config.ts) serving
      # the app with VITE_SCHEDULE_INTERCHANGE on (layered on the canvas authoring + editing/pen
      # flags), so the whole import loop — "Import from file…", the dry-run review dialog
      # + report table, and Confirm import committing and opening the new plan — is exercised end to
      # end (Stage C2 M1, ADR-0050). Runs last, after the prior runs tear down their servers, reusing
      # the ports.
      - name: Web end-to-end tests (schedule interchange flag on)
        run: pnpm --filter @repo/web test:e2e:interchange

      # Flag-ON External-Guest share links journey (playwright.share.config.ts) serving the app with
      # VITE_GUEST_SHARE_LINKS on (layered on the canvas authoring + editing/pen flags),
      # so the whole share loop — the member Share… toolbar item opening ShareLinksDialog (create/list/
      # revoke), the one-time guest URL, and the public session-less `/share#<token>` read-only view
      # across a second, cookie-free browser context (with immediate revocation) — is exercised end to
      # end (ADR-0051 F-M4). Runs last, after the prior runs tear down their servers, reusing the ports.
      - name: Web end-to-end tests (guest share links flag on)
        run: pnpm --filter @repo/web test:e2e:share

      # The library scoping & manageability journey (playwright.library.config.ts). No longer
      # flag-on: ADR-0088 D3 retired VITE_LIBRARY_SCOPING and deleted the raw-<select> pickers it
      # selected, so this drives the only library surface there is. The config still pins six OTHER
      # flags this journey's plan steps need — only the one line went. Its two load-bearing claims
      # are proven end to end (ADR-0053): a PROJECT
      # calendar is offered to its own project's plan picker and absent from a sibling project's, and
      # archiving a resource retires it from the picker while its existing assignment survives
      # untouched. Runs last, after the prior runs tear down their servers, reusing the ports.
      - name: Web end-to-end tests (library scoping)
        run: pnpm --filter @repo/web test:e2e:library

      # The calendar shift-editor journey (playwright.calendar-shifts.config.ts). No longer flag-on:
      # ADR-0088 D3 retired VITE_CALENDAR_SHIFT_EDITOR and deleted the weekday-checkbox form it
      # selected, so this drives the only calendar form there is. It proves the four claims a mocked fetch structurally
      # cannot (ADR-0067/ADR-0068): the hours a planner types round-trip to the minute, a rename does
      # not flatten them (the defect the epic was opened on), a calendar with no working week stays
      # savable on the SECOND save, and a dated exception's hours can be edited in place through the
      # per-exception PATCH — the only place its optimistic `version` is testable at all.
      - name: Web end-to-end tests (calendar shift editor)
        run: pnpm --filter @repo/web test:e2e:calendar-shifts

      # Flag-ON sub-day durations/lags journey (playwright.sub-day.config.ts) serving the app with
      # VITE_SUB_DAY_DURATIONS on. It proves what a mocked fetch structurally cannot (ADR-0070): that
      # `4h` is stored as 240 minutes on a calendar whose day is 480 and not 1440 — a wrong factor
      # errors nowhere, it just stores three times the work — that a bare number still converts on
      # the plan's own day, that an unrelated rename does not flatten a sub-day value through the
      # full-definition PATCH, and that a lag moved to the 24-hour calendar is re-measured as
      # elapsed time.
      - name: Web end-to-end tests (sub-day durations flag on)
        run: pnpm --filter @repo/web test:e2e:sub-day

      # The per-assignment join lag (ADR-0071 M4) against a real API with the pen enforced. What a
      # mocked fetch structurally cannot prove: that `1d` on an EIGHT-hour calendar stores 480
      # minutes and not 1,440 (a wrong factor errors nowhere, it just schedules three times the
      # work); that the write is pen-gated; that the row's optimistic `version` is refreshed between
      # two consecutive saves (a mock accepts any version); and — the failure ADR-0070's journey
      # caught twice — that the plan's calendar actually reaches the control, rather than the field
      # rendering, looking right, and quietly refusing the unit a planner reaches for.
      - name: Web end-to-end tests (assignment lag flag on)
        run: pnpm --filter @repo/web test:e2e:assignment-lag

      # The Float paths surface (audit F4) against a real API and a real eight-hour calendar. What a
      # mocked fetch structurally cannot prove: that a branch carrying ONE working day of float
      # reads `+1d` and not `0d` — the defect this whole epic descends from, where dividing the
      # engine's 480 minutes by a flat 1440 renders a real signal as no signal at all; that the
      # toolbar item is LIVE in the Gantt rather than shaded, which is the seam this epic found
      # broken and fixed; that the panel survives a view switch; and that the emphasis reaches both
      # the canvas's parallel listbox and the Gantt's rows in words, not by opacity alone.
      - name: Web end-to-end tests (float paths flag on)
        run: pnpm --filter @repo/web test:e2e:float-paths

      # Search that navigates (`VITE_CANVAS_SEARCH_NAV`) against a real API with the pen enforced.
      # What a mocked fetch and a mounted-in-isolation toolbar structurally cannot prove: that Enter
      # reaches the handler through the PORTALLED chrome band (React events follow the React tree,
      # the canvas's key listener is a native `window` one); that a full cycle leaves focus in the
      # field, which is the difference between a find control and one that works exactly once; that
      # **Escape in the field does not disarm an armed Link tool** — the ADR-0064 contract this epic
      # amended, and the single assertion here worth the whole suite; and that the Gantt walks the
      # same match set without stealing focus to do it.
      - name: Web end-to-end tests (search navigation flag on)
        run: pnpm --filter @repo/web test:e2e:search-nav

      # The canvas plural selection (`VITE_CANVAS_MULTI_SELECT`) against a real API with the pen
      # enforced. What no mocked test can reach: the optimistic-`version` trap (a mocked fetch
      # accepts any version, so a bulk batch's version threading is only testable here); and that a
      # bulk delete's undo brings the LINKS back, which is the CQ-4 answer — a re-create would
      # restore the bars and silently lose the logic between them, and a mock would report success
      # either way.
      - name: Web end-to-end tests (multi-select flag on)
        run: pnpm --filter @repo/web test:e2e:multi-select

      # Activity copy / paste / duplicate (`VITE_ACTIVITY_COPY_PASTE`) against a real API with the
      # pen enforced. What no mocked test can reach: that a copy carries what the census says, read
      # back from the API rather than from the DOM under test (ADR-0070 M6); that the internal-edge
      # rule holds against a real graph, with zero links from a clone to an original; that one
      # Ctrl+Z removes the whole paste WITH its links; and that Ctrl+C stands down for a real text
      # selection — `window.getSelection` is stubbed in the unit suite, so only a browser has one.
      - name: Web end-to-end tests (copy/paste flag on)
        run: pnpm --filter @repo/web test:e2e:copy-paste

      # Theme-parametrised accessibility (ADR-0055 §5). Every other suite scans the DEFAULT
      # theme, which is how the Corporate theme shipped with six contrast defects past a green
      # axe run. This one boots the shell once per picker option — light, dark, corporate, and
      # system under dark emulation — and additionally asserts the six defect sites by name,
      # because an invisible button is not an axe rule and axe measures no hover state.
      - name: Web end-to-end tests (all four themes, accessibility, flag OFF)
        run: pnpm --filter @repo/web test:e2e:designed-ui

      # The chrome band with VITE_DESIGNED_CHROME on (ADR-0055 S2) — the header and a plan's two
      # toolbar rows rendered as ONE surface, the tab order that follows from the new DOM order,
      # and axe over the band itself. Since the S5-T4 flip this is the SHIPPED DEFAULT; the
      # sibling step above pins the flags off and is now the rollback-parity side. Both are kept:
      # dropping either would leave one half of the rollback contract unproven.
      - name: Web end-to-end tests (designed chrome band, flag on — the shipped default)
        run: pnpm --filter @repo/web test:e2e:designed-chrome

      # Flag-ON Gantt view journey (playwright.gantt.config.ts) serving the app with VITE_GANTT_VIEW
      # on (layered on the canvas authoring + editing/pen flags), proving ADR-0059's
      # claims end to end: an activity authored on the diagram is the same row in the Gantt with the
      # dates the engine computed, `?view=gantt` survives a reload, and the grid is arrow-navigable
      # and axe-clean. Runs after the prior suites tear down their servers, reusing the ports.
      - name: Web end-to-end tests (Gantt view flag on)
        run: pnpm --filter @repo/web test:e2e:gantt

      # The tabbed activity editor journey (playwright.activity-editor.config.ts) with the pen
      # enforced at the API. NOT a flag-on journey: `VITE_ACTIVITY_EDITOR_TABS` was retired on
      # 2026-08-11 (ADR-0089) and the editor is the only one there is — this comment claimed
      # otherwise until 2026-08-17, the fourth instance of a defect the same pass fixed three of.
      # It proves ADR-0060's permission
      # claims against a real 423: two scopes save in one session (the second carrying the version
      # the first produced — a mocked fetch cannot test that), Steps opens the Progress tab focused
      # on its panel, weighted steps take over the physical % with a reason, and a holder-less
      # session can still report progress while every definition scope is shut. It also carries
      # ADR-0062's convergence claims, which need the same real server: a link added from the Logic
      # tab is refused by the ENGINE when it closes a cycle (a mock would happily create one) and by
      # the pen with a 423, while progress in the same session is not, and a resource assigned from
      # the Resources tab persists. Runs after the prior suites tear down their servers, reusing the
      # ports.
      - name: Web end-to-end tests (tabbed activity editor)
        run: pnpm --filter @repo/web test:e2e:activity-editor

      # Flag-ON WBS improvements journey (playwright.wbs.config.ts) with VITE_WBS_IMPROVEMENTS on
      # AND the pen enforced at the API, proving ADR-0063's claims against a real server: the batch
      # membership write is per-row optimistic-locked (a mocked fetch accepts any version, so the
      # versions the multi-select sends are only really checked here), dissolving a summary loses no
      # activity (counted at the API, not read off the screen), the cascade-delete warning states
      # the real count, the pinned canvas band leaves the accessibility listbox's count unchanged,
      # and releasing the pen shuts the writes. Runs after the prior suites tear down their servers,
      # reusing the ports.
      - name: Web end-to-end tests (WBS improvements flag on)
        run: pnpm --filter @repo/web test:e2e:wbs

      # Canvas authoring flow (playwright.authoring-flow.config.ts) with the pen enforced at the API
      # and the coalesced auto-recalculation live (ADR-0064). It exists because the epic's founding
      # defect — a link whose endpoints came back reversed — cannot be reached from a unit test: the
      # gesture reducer maps the first click to the predecessor with no inversion on any path, so
      # only a real browser, a real recalculation cadence and a real server can say which of those
      # clicks actually became a pick. Runs after the prior suites tear down their servers.
      - name: Web end-to-end tests (canvas authoring flow)
        run: pnpm --filter @repo/web test:e2e:authoring-flow

      # Visual placement (playwright.workspace-chrome.config.ts, workspace-chrome M2) with the pen
      # enforced at the API. **The first journey in this repository to run in Visual mode at all** —
      # the other fourteen canvas configs pin VITE_SCHEDULING_MODES off, each for a good local
      # reason, and the unrecorded consequence was that the one placement rule a planner exercises
      # by dragging a bar had no end-to-end coverage. That is exactly where a defect had been
      # sitting: a `Snap to grid` toggle that appeared to do the snapping while the engine did it
      # unconditionally, and whose own contribution was to write a Saturday drop back as Friday —
      # earlier than the planner placed it. The claim that replaces it ("the RAW dropped day is
      # persisted and the SERVER rolls it forward") is a statement about a request body, which a
      # mocked `fetch` structurally cannot check. Runs at 1646 CSS px, the width this epic's
      # measurements were taken at. Runs after the prior suites tear down their servers.
      - name: Web end-to-end tests (workspace chrome — Visual placement)
        run: pnpm --filter @repo/web test:e2e:workspace-chrome

      # Flag-ON audit log journey (playwright.audit.config.ts) with VITE_AUDIT_LOG on (ADR-0072).
      # The audit log is a claim about writes that happened somewhere else, so a mocked fetch cannot
      # be wrong about a row it invented. Against a real API and database this proves the producers
      # fire inside the transactions that succeeded (six real actions, six findable rows), that a
      # role change's `before` is the membership's real prior value and not the request DTO, that
      # `audit:read` is refused with a 403 in the non-admin's own session rather than by the hidden
      # nav link, and that the `/me` feed is scoped by ACTOR — the teammate is the SUBJECT of the
      # role change and must not see it. Runs after the prior suites tear down their servers.
      - name: Web end-to-end tests (audit log flag on)
        run: pnpm --filter @repo/web test:e2e:audit

      # ADR-0074 M5-T3. Two steps, because `AUTH_REQUIRE_EMAIL_VERIFICATION` is a server-boot
      # value: one API process cannot be both enforcing and not, and the recovery half needs it
      # OFF (an account that cannot sign in cannot reach `/account`). Both stand up an SMTP sink
      # and drive the real `SmtpMailService` — the only place in the repo that adapter runs against
      # a socket, and the only way to obtain a reset link at all, since it goes to the mailbox and
      # the verification row now stores its identifier hashed.
      - name: Web end-to-end tests (account recovery flags on)
        run: pnpm --filter @repo/web test:e2e:account

      # The enforcement half, against its own API process with the switch ON. It was committed red
      # while the cause was open, and the answer was two product defects rather than a fault in the
      # harness: the router JSON-parses `?verified=1` into a number (TECH_DEBT #96), and sign-up
      # sent no `callbackURL`, so the very first verification link landed on `/` and the guard
      # bounced the new member to `/sign-in` saying nothing. Both are unflagged runtime branches on
      # a server switch, so this is the only step that can see either.
      - name: Web end-to-end tests (email verification enforced)
        run: pnpm --filter @repo/web test:e2e:account-verify

      # ADR-0086, staff-console M3. **Not a flag-on suite** — every sibling pins a `VITE_` constant
      # and this one pins a SERVER variable, `STAFF_EMAILS`, because staff-ness is a server fact the
      # bundle cannot see. It lands with M3 because M3 is the first milestone with a user-facing
      # entry point (ADR-0081 §2), and this epic had already paid for that rule: M2 passed 1,589
      # unit tests and could not serve one request. This suite earned its keep on its first green
      # run too — it caught `apiFetch('/api/v1/staff/me')` against an `API_BASE_URL` that is already
      # `/api/v1`, which the component tests could not see because they mock `apiFetch` and assert
      # back whatever path the code passed them.
      - name: Web end-to-end tests (staff console)
        run: pnpm --filter @repo/web test:e2e:staff

      # The public screens, **measured** rather than reasoned about (ADR-0077 M6-T1): ten
      # URL-reachable states × six viewports × three themes, plus a real invitation carrying a
      # 100-character organisation name and a fulfilled 429. It earned its place before it was ever
      # committed — its first four runs each found a live defect no unit test could see, because
      # jsdom has no layout: a brand band stretched to 47% of a phone screen by implicit grid
      # `align-content`, a tagline rendering at every width against its own acceptance criterion,
      # and two WCAG 1.4.10 reflow failures at 320px (a 31-character button label, and an email
      # address setting a grid column's min-content width).
      - name: Web end-to-end tests (public screens layout)
        run: pnpm --filter @repo/web test:e2e:public

      # The CSP gate. Unlike every step above it, this one builds the app and serves `dist/` through
      # `vite preview`, because the policy applies to the deployed artefact and the dev server is
      # the wrong one — it serves unbundled modules and injects an inline react-refresh preamble
      # that `script-src 'self'` would report as a violation production can never have.
      #
      # It exists because the policy was derived by reading our source and validated by a person
      # watching a console, and neither method sees what a DEPENDENCY does at runtime — which is
      # what the first real violation on the deployed origin turned out to be (Zod probing for
      # `eval`). Last step, since it is the only one paying for a production build.
      - name: Web end-to-end tests (Content-Security-Policy)
        run: pnpm --filter @repo/web test:e2e:csp

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report-account/
            apps/web/playwright-report-csp/
            apps/web/playwright-report-account-verify/
            apps/web/playwright-report-edit/
            apps/web/playwright-report-toolbar/
            apps/web/playwright-report-authoring/
            apps/web/playwright-report-authoring-flow/
            apps/web/playwright-report-activity-editor/
            apps/web/playwright-report-wbs/
            apps/web/playwright-report-programme/
            apps/web/playwright-report-notes/
            apps/web/playwright-report-undo/
            apps/web/playwright-report-loe/
            apps/web/playwright-report-resource-view/
            apps/web/playwright-report-interchange/
            apps/web/playwright-report-share/
            apps/web/playwright-report-library/
            apps/web/playwright-report-designed-ui/
            apps/web/playwright-report-designed-chrome/
            apps/web/playwright-report-gantt/
            apps/web/playwright-report-audit/
            # Added 2026-08-17 (devops review of the flag-cleanup pass). These eleven steps already
            # existed and already ran; their reports were simply never collected, and
            # `if-no-files-found: ignore` meant nothing said so. A red run in any of them produced
            # no artefact to debug from — which is the same class of silent gap as the suites
            # below, one layer out: the list is prose, and `check-flags.mjs`'s own docblock names
            # prose as what it cannot cover.
            apps/web/playwright-report-calendar-shifts/
            apps/web/playwright-report-sub-day/
            apps/web/playwright-report-assignment-lag/
            apps/web/playwright-report-float-paths/
            apps/web/playwright-report-search-nav/
            apps/web/playwright-report-multi-select/
            apps/web/playwright-report-copy-paste/
            apps/web/playwright-report-toolbar-fit/
            apps/web/playwright-report-workspace-chrome/
            apps/web/playwright-report-staff/
            apps/web/playwright-report-public/
          if-no-files-found: ignore
          retention-days: 7

  image:
    name: Build & smoke-boot images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Build the api + web images from source and boot the full stack
      # (Postgres + API + web), then wait for every container to report healthy.
      # This exercises the one artifact users actually run — the container —
      # which the source-level jobs never do, so runtime-only regressions
      # (module resolution, Prisma client generation, entrypoint migrations,
      # missing prod dependencies) are caught here rather than in production.
      # See ADR-0020.
      - name: Build & boot the stack
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.ci.yml
          up -d --build --wait --wait-timeout 240

      - name: Smoke-test the API health endpoint
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 http://localhost:3000/api/v1/health

      - name: Smoke-test the web app
        run: curl -fsS --retry 5 --retry-all-errors --retry-delay 3 -o /dev/null http://localhost:8080/

      # The nginx config is an envsubst TEMPLATE (ADR-0074 §4), so these assertions are about the
      # RENDERED config rather than the file in git — and the failure they exist to catch is the
      # quiet one: an unfiltered envsubst run replaces nginx's own `$host`/`$scheme` with empty
      # strings, producing a container that still boots and still serves the SPA while forwarding
      # no Host and no client IP to the API. `curl -o /dev/null` above would not notice.
      - name: Verify the rendered nginx config and its security headers
        run: |
          set -euo pipefail

          # 1. envsubst substituted the CSP variables...
          headers=$(curl -fsS -D - -o /dev/null http://localhost:8080/)
          echo "$headers" | grep -qi 'content-security-policy-report-only:' \
            || { echo 'CSP report-only header missing'; echo "$headers"; exit 1; }
          echo "$headers" | grep -qi "img-src 'self' blob:" \
            || { echo 'CSP is present but not the expected policy'; echo "$headers"; exit 1; }
          echo "$headers" | grep -qi 'permissions-policy:.*camera=()' \
            || { echo 'Permissions-Policy missing'; exit 1; }
          # clipboard-write must NOT be denied: two Copy buttons depend on it.
          ! echo "$headers" | grep -qi 'permissions-policy:.*clipboard' \
            || { echo 'Permissions-Policy denies clipboard — this breaks the Copy buttons'; exit 1; }
          echo "$headers" | grep -qi 'cross-origin-opener-policy:' || { echo 'COOP missing'; exit 1; }

          # 2. ...and did NOT eat nginx's own variables. `$host`/`$scheme` survive as literals in
          #    the rendered file; an empty value here is the comprehensively-wrong config.
          rendered=$(docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            exec -T web cat /etc/nginx/conf.d/default.conf)
          echo "$rendered" | grep -q 'proxy_set_header Host \$host;' \
            || { echo 'envsubst ate $host — check NGINX_ENVSUBST_FILTER'; exit 1; }
          echo "$rendered" | grep -q '\$proxy_add_x_forwarded_for' \
            || { echo 'envsubst ate $proxy_add_x_forwarded_for'; exit 1; }
          echo "$rendered" | grep -q "'' *\$scheme;" \
            || { echo 'envsubst ate the X-Forwarded-Proto fallback map'; exit 1; }

          # 3. The theme-boot script is served and is NOT immutably cached (it is not
          #    fingerprinted, so an immutable cache would strand a change forever).
          boot=$(curl -fsS -D - -o /dev/null http://localhost:8080/theme-boot.js)
          echo "$boot" | grep -qi 'cache-control:.*max-age=300' \
            || { echo 'theme-boot.js is missing its short cache header'; echo "$boot"; exit 1; }
          ! echo "$boot" | grep -qi 'immutable' \
            || { echo 'theme-boot.js must not be immutably cached'; exit 1; }

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
